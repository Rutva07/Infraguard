[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infraguard"
version = "1.0.0"
description = "Reproducible infrastructure telemetry anomaly detection and failure forecasting"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "xgboost>=2.0,<4",
  "joblib>=1.3,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
aws = ["boto3>=1.34", "awswrangler>=3.8", "pyarrow>=15", "s3fs>=2024.3"]
local-sql = ["duckdb>=1.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
infraguard = "infraguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
